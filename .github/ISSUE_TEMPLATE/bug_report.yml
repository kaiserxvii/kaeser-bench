name: Bug report
description: Report reproducibility, tooling, or evaluation behavior that is incorrect.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the task, run inputs, commands, and smallest reproducible example.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Bun version, and relevant workspace or provider versions.
