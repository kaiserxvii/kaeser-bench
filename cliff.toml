[changelog]
header = """
# Changelog

All notable changes to Kaeser Bench are documented here. This file is generated from the Git
history and GitHub metadata by [git-cliff](https://git-cliff.org/) using Conventional Commits.

"""
body = """
{% if version %}\
    ## {{ version | trim_start_matches(pat="v") }}
{% else %}\
    ## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        - {% if commit.remote and commit.remote.pr_number %}\
            [#{{ commit.remote.pr_number }}](https://github.com/kaiserxvii/kaeser-bench/pull/{{ commit.remote.pr_number }}) \
          {% endif %}\
          [`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/kaiserxvii/kaeser-bench/commit/{{ commit.id }}) \
          {% if commit.remote and commit.remote.username and commit.remote.username != "dependabot[bot]" %}\
            Thanks [@{{ commit.remote.username }}](https://github.com/{{ commit.remote.username }})! - \
          {% endif %}\
          {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
          {% if commit.remote and commit.remote.pr_title %}\
            {{ commit.remote.pr_title | upper_first }}\
          {% else %}\
            {{ commit.message | split(pat="\n") | first | upper_first }}\
          {% endif %}\
          {% if commit.conventional and commit.body %}

            {% for line in commit.body | trim | split(pat="\n") %}\
              {{ "  " }}{{ line }}
            {% endfor %}\
          {% endif %}\
    {% endfor %}
{% endfor %}
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
processing_order = [
  "conventional_commits",
  "commit_preprocessors",
  "commit_parsers",
  "link_parsers",
]
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { body = "(?i)BREAKING[ -]CHANGE:", group = "<!-- 0 -->Major Changes" },
  { message = "^[a-zA-Z]+(?:\\([^)]*\\))?!:", group = "<!-- 0 -->Major Changes" },
  { message = "^feat", group = "<!-- 1 -->Minor Changes" },
  { message = ".*", group = "<!-- 2 -->Patch Changes" },
]
protect_breaking_commits = true
filter_commits = false
fail_on_unmatched_commit = true
tag_pattern = "v?[0-9].*"
sort_commits = "oldest"
link_parsers = [
  { pattern = "#(\\d+)", href = "https://github.com/kaiserxvii/kaeser-bench/issues/$1" },
]

[remote.github]
owner = "kaiserxvii"
repo = "kaeser-bench"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
