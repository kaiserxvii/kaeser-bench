[changelog]
header = """
# Changelog

All notable changes to Kaeser Bench are documented here. This file is generated from the Git
history by [git-cliff](https://git-cliff.org/) using Conventional Commits.

"""
body = """
{% if version %}\
    ## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
processing_order = [
  "conventional_commits",
  "commit_preprocessors",
  "commit_parsers",
  "link_parsers",
]
commit_preprocessors = [
  { pattern = "(?s)\\n.*$", replace = "" },
]
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs?", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^build", group = "Build" },
  { message = "^ci", group = "Continuous integration" },
  { message = "^style", group = "Styling" },
  { message = "^revert", group = "Reverted" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "Maintenance" },
  { message = ".*", group = "Other" },
]
protect_breaking_commits = true
filter_commits = false
fail_on_unmatched_commit = true
tag_pattern = "v?[0-9].*"
sort_commits = "oldest"
link_parsers = [
  { pattern = "#(\\d+)", href = "https://github.com/kaiserxvii/kaeser-bench/issues/$1" },
]
